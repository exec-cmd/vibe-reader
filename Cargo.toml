[workspace]
members = ["src/core", "src/cli", "src/gui"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["cmd.exe"]
repository = "https://github.com/exec-cmd/vibe-reader"

[workspace.dependencies]
vibe-reader-core = { path = "src/core", version = "0.2.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# Dependencies are optimized in dev builds too: unoptimized pdf-extract took 15 s to open a
# 600-page PDF that a release build opens in 1.5 s. Our own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
