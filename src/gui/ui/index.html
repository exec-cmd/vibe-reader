<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vibe-reader</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="reader.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="atmosphere.css">
  <!-- Optional: <config>/ui/user.css overrides anything above. -->
  <link rel="stylesheet" href="user.css">
</head>
<body>
  <!-- Library: sidebar, shelves of spines, book details. In mini mode only the toolbar and one shelf remain. -->
  <section class="view library" id="home" hidden>
    <header class="toolbar">
      <button class="icon-btn" id="toggle-sidebar" data-icon="menu" data-i18n-title="toggleSidebar" data-hide-mini></button>
      <span class="brand">vibe-reader</span>
      <label class="search-box"><span data-icon="search" data-size="16"></span><input id="search" type="search" autocomplete="off" data-i18n-placeholder="search"></label>
      <span class="grow"></span>
      <button class="select-btn" id="group-by" data-hide-mini><span class="select-caption" data-i18n="groupBy"></span><span class="select-value"></span><span data-icon="chevronDown" data-size="14"></span></button>
      <button class="select-btn" id="sort-by" data-hide-mini><span class="select-caption" data-i18n="sortBy"></span><span class="select-value"></span><span data-icon="chevronDown" data-size="14"></span></button>
      <button class="btn primary" id="open-files" data-icon="import" data-hide-mini><span data-i18n="addBooks"></span></button>
      <button class="icon-btn" id="mini-toggle" data-icon="shrink" data-i18n-title="miniMode"></button>
      <button class="icon-btn" id="open-settings" data-icon="gear" data-i18n-title="settings" data-hide-mini></button>
    </header>
    <div class="library-body">
      <nav class="sidebar" id="sidebar" aria-label="Library"></nav>
      <main class="room" id="room" tabindex="-1">
        <section class="desk" id="desk" data-hide-mini></section>
        <div class="stacks" id="shelves"></div>
      </main>
      <aside class="details" id="card" aria-live="polite"></aside>
    </div>
  </section>

  <!-- Reader: the window is the book. A sheet on a desk, a running head and a folio; the dock with
       every control floats at the bottom and hides while reading. -->
  <section class="view reader" id="reader" data-layout="pages" data-bg="" hidden>
    <style id="preset-css"></style>
    <div class="bg" id="bg"></div>
    <canvas id="fx"></canvas>
    <div class="fx-overlay"></div>
    <div class="splash" id="splash"></div>
    <div class="lite-bar" id="lite-bar" hidden>
      <span class="title" id="lite-title"></span>
      <button class="btn" id="lite-add" data-i18n="addToLibrary"></button>
    </div>
    <div class="reader-body">
      <aside class="side-panel" id="side" data-open="false">
        <div class="tabs" role="tablist" id="side-tabs">
          <button class="tab" data-tab="toc" data-i18n="contents"></button>
          <button class="tab" data-tab="thumbs" data-i18n="pages"></button>
          <button class="tab" data-tab="notes" data-i18n="notes"></button>
          <button class="tab" data-tab="search" data-i18n="find"></button>
          <button class="tab" data-tab="agent" data-i18n="agentTab"></button>
        </div>
        <div class="tab-body" id="side-body"></div>
      </aside>
      <div class="running-head"><span id="reader-sub"></span></div>
      <div class="viewport" id="viewport">
        <div class="book" id="book">
          <div class="frame" id="frame"><article class="page" id="page"></article></div>
          <div class="leaf" id="leaf" hidden></div>
        </div>
      </div>
      <button class="folio" id="folio" data-i18n-title="goToPage"></button>
    </div>
    <nav class="dock" id="dock" aria-label="Reader">
      <button class="icon-btn" id="back" data-icon="back" data-i18n-title="backKey"></button>
      <button class="icon-btn" id="toggle-side" data-icon="toc" data-i18n-title="sidePanel"></button>
      <span class="dock-sep"></span>
      <div class="pager">
        <button class="icon-btn" id="prev-page" data-icon="chevronLeft" data-i18n-title="prevPage"></button>
        <input class="page-input" id="page-input" inputmode="numeric" autocomplete="off" aria-label="Page">
        <span class="page-total" id="page-total"></span>
        <button class="icon-btn" id="next-page" data-icon="chevronRight" data-i18n-title="nextPage"></button>
      </div>
      <div class="zoom" id="zoom-tools">
        <button class="icon-btn" id="zoom-out" data-icon="zoomOut" data-i18n-title="zoomOut"></button>
        <button class="select-btn compact" id="zoom-level"><span class="select-value"></span><span data-icon="chevronDown" data-size="14"></span></button>
        <button class="icon-btn" id="zoom-in" data-icon="zoomIn" data-i18n-title="zoomIn"></button>
      </div>
      <span class="dock-sep"></span>
      <button class="icon-btn" id="layout-btn" data-icon="pages" data-i18n-title="layout"></button>
      <button class="icon-btn" id="search-btn" data-icon="search" data-i18n-title="findInBook"></button>
      <button class="icon-btn" id="translate-btn" data-icon="translate" data-i18n-title="translator"></button>
      <button class="icon-btn" id="agent-btn" data-icon="agent" data-i18n-title="agentMenu"></button>
      <span class="dock-sep"></span>
      <button class="icon-btn" id="look-btn" data-icon="sparkle" data-i18n-title="atmosphere"></button>
      <button class="icon-btn" id="sound-btn" data-icon="sound" data-i18n-title="soundToggle"></button>
      <button class="icon-btn" id="mode-btn" data-icon="moon" data-i18n-title="cmdMode"></button>
      <button class="icon-btn" id="fullscreen-btn" data-icon="fullscreen" data-i18n-title="fullscreen"></button>
      <button class="icon-btn" id="reader-more" data-icon="more" data-i18n-title="more"></button>
    </nav>
    <div class="progress"><i id="progress"></i></div>
    <div class="flash" id="flash"></div>
    <div class="selbar" id="selbar" hidden>
      <button class="icon-btn" data-act="highlight" data-icon="marker" data-i18n-title="highlight"></button>
      <button class="icon-btn" data-act="note" data-icon="notes" data-i18n-title="note"></button>
      <button class="icon-btn" data-act="translate" data-icon="translate" data-i18n-title="translate"></button>
      <button class="icon-btn" data-act="agent" data-icon="agent" data-i18n-title="sendSelection"></button>
      <button class="icon-btn" data-act="copy" data-icon="copy" data-i18n-title="copy"></button>
      <button class="icon-btn" data-act="find" data-icon="search" data-i18n-title="findInBook"></button>
    </div>
    <div class="notepop" id="notepop" hidden></div>
    <section class="translator" id="translator" hidden aria-labelledby="translator-title"></section>
  </section>

  <section class="view settings-view" id="settings-view" hidden></section>

  <div class="palette" id="palette" hidden>
    <div class="palette-box">
      <input id="palette-input" autocomplete="off" data-i18n-placeholder="paletteHint">
      <ul id="palette-list" role="listbox"></ul>
    </div>
  </div>
  <div class="progress-strip" id="progress-strip" hidden><span class="progress-label"></span><span class="progress-bar"><i></i></span></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="vendor/highlight/highlight.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
