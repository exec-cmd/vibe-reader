[package]
name = "vibe-reader-gui"
description = "Desktop window of vibe-reader (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "vibe-reader-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
vibe-reader-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# custom-protocol embeds ui/ as release assets even for a plain `cargo build`.
tauri = { version = "2.12", features = ["custom-protocol"] }
