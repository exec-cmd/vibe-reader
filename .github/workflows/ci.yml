name: CI

# Paused: runs only when started by hand from the Actions tab. Restore `push` and
# `pull_request` here to check every push again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Core without optional formats
        run: cargo test -p vibe-reader-core --no-default-features

      - name: Release build
        run: cargo build --release --workspace

      - name: Size budget (100 MB)
        run: |
          size=$(du -cb target/release/vibe-reader target/release/vibe-reader-gui src/gui/ui | tail -1 | cut -f1)
          echo "binaries + UI: $((size / 1024 / 1024)) MB"
          test "$size" -le $((100 * 1024 * 1024))
