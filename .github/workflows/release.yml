name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Build binaries
        run: cargo build --release --workspace

      - name: Build AppImage
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd src/gui && cargo tauri build --bundles appimage

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="vibe-reader-${version}-x86_64-linux"
          mkdir -p "dist/${name}"
          cp target/release/vibe-reader target/release/vibe-reader-gui README.md README_RU.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          cp target/release/bundle/appimage/*.AppImage "dist/vibe-reader-${version}-x86_64.AppImage"
          cd dist && sha256sum *.tar.gz *.AppImage > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.AppImage dist/SHA256SUMS --generate-notes
